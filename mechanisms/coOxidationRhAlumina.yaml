description: |-
  CO oxidation over Rh; DETCHEM mechanism v1.1 (2013), converted to
  Cantera. This copy adds an inert alpha-alumina solid phase for local
  thermal equilibrium calculations.

  Alpha-alumina thermodynamic data use the NIST Chemistry WebBook Shomate
  fit for 298 to 2327 K (Chase, 1998; data reviewed December 1979):
  https://webbook.nist.gov/cgi/cbook.cgi?ID=C1344281&Table=on&Type=JANAFS

  The alumina density is a representative fully dense value from the NIST
  Structural Ceramics Database:
  https://srdata.nist.gov/CeramicDataPortal/Scd/Z00063
